# ---------------------------------------------------------------------------
# L'épreuve complète, à chaque poussée.
#
# POURQUOI ELLE EXISTE. Soixante-trois commits sans intégration continue :
# `check:all` ne tournait que sur la machine de celui qui écrivait, et une
# suite peut passer chez lui parce que sa base de démonstration porte encore
# l'état laissé par la veille. Ce fichier la fait tourner contre un PostgreSQL
# NEUF, semé de zéro, à chaque fois.
#
# C'est aussi la seule façon de vérifier ce qui ne se voit qu'à froid : que
# `scripts/preparer-base.sh` applique bien les trente migrations dans l'ordre
# sur une base vide — le jour de la première vraie école, c'est ce chemin-là
# qui sera emprunté, et aucun autre.
# ---------------------------------------------------------------------------
name: épreuve

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: epreuve
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ADMIN_DATABASE_URL: postgres://postgres:epreuve@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://fasoschool_app:epreuve@127.0.0.1:5432/demo
      # LE MODE SIMULÉ EST EXPLICITE, JAMAIS PAR DÉFAUT. Le serveur refuse de
      # démarrer sans, et l'épreuve ne doit surtout pas envoyer de vrais SMS.
      SMS_PROVIDER: mock
      SMS_COST_FCFA: "8"
      PAYMENT_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Le navigateur de l'épreuve
        run: npx playwright install --with-deps chromium

      - name: Préparer une base NEUVE
        # Sur une base vide, donc par le chemin qu'empruntera la première
        # vraie école — et pas par celui d'une base déjà migrée. Le script
        # crée lui-même le rôle applicatif et refuse de continuer s'il porte
        # SUPERUSER ou BYPASSRLS.
        env:
          APP_ROLE: fasoschool_app
          APP_PASSWORD: epreuve
        run: bash scripts/preparer-base.sh demo

      - name: Le rôle applicatif n'a AUCUN privilège
        # Vérifié une seconde fois, explicitement : c'est la règle qui décide
        # de tout. Un superutilisateur contourne entièrement le row-level
        # security, et le cloisonnement entre établissements disparaîtrait
        # sans qu'aucun test ne le dise.
        run: |
          DROITS="$(psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "select rolsuper::text || ' ' || rolbypassrls::text
               from pg_roles where rolname = 'fasoschool_app'")"
          echo "rolsuper rolbypassrls = $DROITS   (attendu : false false)"
          test "$DROITS" = "false false" \
            || { echo "fasoschool_app a des privilèges qu'il ne doit pas avoir"; exit 1; }

      - name: Semer la démonstration
        run: npm run demo

      - name: L'épreuve de cloisonnement
        run: bash scripts/epreuve-cloisonnement.sh

      - name: check:all
        run: npm run check:all

      - name: L'image de production se construit
        run: docker build -t fasoschool:epreuve .

      - name: Et elle démarre
        run: |
          docker run -d --name fs --network host \
            -e DATABASE_URL="postgres://fasoschool_app:epreuve@127.0.0.1:5432/demo" \
            -e SMS_PROVIDER=mock -e PORT=8080 fasoschool:epreuve
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/sante > /tmp/sante.json; then break; fi
            sleep 2
          done
          cat /tmp/sante.json
          grep -q '"ok":true' /tmp/sante.json
          # L'image ne doit pas prétendre envoyer des SMS alors qu'elle simule.
          grep -q '"simule":true' /tmp/sante.json
          docker logs fs | tail -20
